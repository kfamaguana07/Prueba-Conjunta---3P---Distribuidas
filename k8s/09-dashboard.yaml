apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: cavalocal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: kfamaguana/cavalocal-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: cavalocal
spec:
  selector:
    app: dashboard
  ports:
    - port: 80
      targetPort: 80
