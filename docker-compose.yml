# docker-compose — entorno local de CavaLocal + auditoría
# Uso:  docker compose up --build
#
# Servicios:
#   rabbitmq       : broker AMQP (5672) + management UI (15672)
#   postgres-app   : BD del backend CavaLocal
#   postgres-audit : BD del microservicio de auditoría
#   backend        : API NestJS (publica eventos en RabbitMQ)
#   ms-audit       : consume RabbitMQ, persiste, expone REST + SSE
#   dashboard      : panel estático servido por nginx

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: audit_user
      RABBITMQ_DEFAULT_PASS: audit_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  postgres-app:
    image: postgres:16-alpine
    container_name: postgres-app
    environment:
      POSTGRES_USER: cavalocal
      POSTGRES_PASSWORD: cavalocal
      POSTGRES_DB: cavalocal
    ports:
      - "5432:5432"
    volumes:
      - pg-app-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cavalocal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  postgres-audit:
    image: postgres:16-alpine
    container_name: postgres-audit
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit
    ports:
      - "5433:5432"
    volumes:
      - pg-audit-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  backend:
    build: ./backend
    container_name: cavalocal-backend
    depends_on:
      postgres-app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cavalocal:cavalocal@postgres-app:5432/cavalocal?schema=public
      JWT_SECRET: cambiame-por-un-secreto-largo
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: audit_user
      RABBITMQ_PASSWORD: audit_pass
      RABBITMQ_EXCHANGE: audit_exchange
      RABBITMQ_QUEUE: audit_queue
      RABBITMQ_ROUTING_KEY: audit.event
      CORS_ORIGINS: "*"
      PORT: 3001
    ports:
      - "3001:3001"
    networks:
      - app-net

  ms-audit:
    build: ./ms-audit
    container_name: ms-audit
    depends_on:
      postgres-audit:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://audit:audit@postgres-audit:5432/audit?schema=public
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: audit_user
      RABBITMQ_PASSWORD: audit_pass
      RABBITMQ_EXCHANGE: audit_exchange
      RABBITMQ_QUEUE: audit_queue
      RABBITMQ_ROUTING_KEY: audit.event
      CORS_ORIGINS: "*"
      PORT: 3002
    ports:
      - "3002:3002"
    networks:
      - app-net

  dashboard:
    image: nginx:alpine
    container_name: dashboard
    depends_on:
      - ms-audit
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
    networks:
      - app-net

volumes:
  pg-app-data:
  pg-audit-data:

networks:
  app-net:
    driver: bridge